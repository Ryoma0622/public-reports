    (function () {
      const themeKey = 'explainer-editorial-theme';
      const root = document.documentElement;
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      function storedChoice() {
        try {
          const value = localStorage.getItem(themeKey);
          return value === 'dark' || value === 'light' ? value : 'system';
        } catch {
          return 'system';
        }
      }
      // data-theme は常に実効値（light / dark）にする。HTML レポートの iframe と
      // チャットの shadow host はこの属性を写すので、「自動」でも値を持たせる。
      function applyTheme(announce) {
        const choice = storedChoice();
        const next = choice === 'system' ? (media.matches ? 'dark' : 'light') : choice;
        const changed = root.dataset.theme !== next;
        root.dataset.theme = next;
        for (const button of document.querySelectorAll('[data-theme-choice]')) {
          button.setAttribute('aria-pressed', button.dataset.themeChoice === choice ? 'true' : 'false');
        }
        for (const button of document.querySelectorAll('[data-theme-toggle]')) {
          const label = next === 'dark' ? 'ライトモードに切り替える' : 'ダークモードに切り替える';
          button.setAttribute('aria-label', label);
          button.title = label;
        }
        if (announce && changed) {
          window.dispatchEvent(new CustomEvent('explainer-theme-change', { detail: next }));
        }
      }
      function setChoice(choice) {
        try {
          if (choice === 'system') localStorage.removeItem(themeKey);
          else localStorage.setItem(themeKey, choice);
        } catch { /* storage 不可でも表示は切り替える */ }
        applyTheme(true);
      }
      function closeMenus(except) {
        for (const menu of document.querySelectorAll('[data-app-menu]')) {
          if (menu === except) continue;
          const button = menu.querySelector(':scope > button');
          const panel = menu.querySelector(':scope > .app-menu-panel');
          if (panel && !panel.hidden) {
            panel.hidden = true;
            button?.setAttribute('aria-expanded', 'false');
          }
        }
      }
      function bindChrome() {
        for (const button of document.querySelectorAll('[data-theme-toggle]')) {
          if (button.dataset.themeBound === '1') continue;
          button.dataset.themeBound = '1';
          button.addEventListener('click', () => setChoice(root.dataset.theme === 'dark' ? 'light' : 'dark'));
        }
        for (const button of document.querySelectorAll('[data-theme-choice]')) {
          if (button.dataset.themeBound === '1') continue;
          button.dataset.themeBound = '1';
          button.addEventListener('click', () => setChoice(button.dataset.themeChoice));
        }
        for (const menu of document.querySelectorAll('[data-app-menu]')) {
          if (menu.dataset.menuBound === '1') continue;
          menu.dataset.menuBound = '1';
          const button = menu.querySelector(':scope > button');
          const panel = menu.querySelector(':scope > .app-menu-panel');
          if (!button || !panel) continue;
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const open = panel.hidden;
            closeMenus(menu);
            panel.hidden = !open;
            button.setAttribute('aria-expanded', open ? 'true' : 'false');
          });
          panel.addEventListener('click', (event) => {
            // 項目を実行したら閉じる。設定（外観・文字サイズ）は続けて操作できるよう残す。
            if (event.target.closest('.app-menu-item')) {
              panel.hidden = true;
              button.setAttribute('aria-expanded', 'false');
            }
          });
        }
        applyTheme(false);
      }
      document.addEventListener('click', (event) => {
        if (!event.target.closest?.('[data-app-menu]')) closeMenus(null);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        const open = document.querySelector('[data-app-menu] > .app-menu-panel:not([hidden])');
        if (!open) return;
        closeMenus(null);
        open.parentElement.querySelector(':scope > button')?.focus();
      });
      media.addEventListener?.('change', () => {
        if (storedChoice() === 'system') applyTheme(true);
      });
      // 読書モードの状態は描画前に戻す（ちらつきを避ける）
      try {
        if (localStorage.getItem('explainer-chrome-hidden') === '1') {
          root.dataset.chromeHidden = 'true';
        }
      } catch { /* storage 不可でも続行 */ }

      applyTheme(false);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindChrome);
      } else {
        bindChrome();
      }
    })();
