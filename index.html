<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公開レポート</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#636366;--line:#dedee3;--accent:#4f46c7;--tint:#eeedfc;--hover:#fafaff}
html[data-theme=dark]{color-scheme:dark;--bg:#111113;--surface:#1c1c1f;--ink:#f5f5f7;--muted:#aaaab2;--line:#38383d;--accent:#b5b0ff;--tint:#302c49;--hover:#242429}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}a{color:inherit;text-decoration:none}button{font:inherit}a,button{-webkit-tap-highlight-color:transparent}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.topbar{border-bottom:1px solid var(--line);background:var(--surface)}.topbar-inner{max-width:1040px;min-height:64px;margin:auto;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--accent)}.brand svg{width:24px;height:24px}.topbar nav{display:flex;gap:8px}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted);cursor:pointer}.icon-button:hover{background:var(--tint);color:var(--accent)}.theme-sun{display:none}html[data-theme=dark] .theme-sun{display:block}html[data-theme=dark] .theme-moon{display:none}
main{max-width:1040px;margin:auto;padding:48px 28px 64px}.intro{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:30px}h1{margin:0;font-size:clamp(28px,5vw,38px);line-height:1.3;letter-spacing:-.045em}.intro p{margin:10px 0 0;color:var(--muted);font-size:14px}.count{display:inline-flex;align-items:center;gap:7px;flex:none;min-height:32px;margin-top:8px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.count svg{width:15px;height:15px}
#reports{display:grid;gap:12px;padding:0;margin:0;list-style:none}.report-link{display:flex;align-items:center;gap:18px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:background .15s,border-color .15s}.report-link:hover{background:var(--hover);border-color:var(--accent)}.report-icon{display:grid;place-items:center;align-self:flex-start;flex:none;width:46px;height:50px;border-radius:12px;background:var(--tint);color:var(--accent)}.report-icon svg{width:24px;height:24px}.report-copy{flex:1;min-width:0}.report-copy h2{margin:0;font-size:18px;line-height:1.6;letter-spacing:-.015em;font-weight:600;overflow-wrap:anywhere}.report-meta{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--muted);font-size:12px}.report-meta svg{width:14px;height:14px}.report-arrow{color:var(--muted);width:18px;height:18px}#status{margin:30px 0;color:var(--muted);font-size:14px}#status:empty{display:none}
@media(max-width:599px){.topbar-inner{min-height:60px;padding:8px 18px}main{padding:32px 18px 48px}.intro{gap:12px;margin-bottom:24px}.intro p{max-width:23em;font-size:13px}.count{padding:4px 8px;margin-top:3px}.report-link{padding:16px;gap:12px}.report-icon{width:34px;height:40px;border-radius:9px}.report-icon svg{width:21px;height:21px}.report-copy h2{font-size:16px}.report-arrow{width:16px;height:16px}.report-meta{margin-top:8px}}
@media(prefers-reduced-motion:reduce){.report-link{transition:none}}
</style>
</head>
<body>
<svg aria-hidden="true" style="display:none"><defs>
<symbol id="library" viewBox="0 0 24 24"><path d="M4 4v16M8 6v14M12 4v16m4-15 4 14"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
<symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></symbol>
<symbol id="github" viewBox="0 0 24 24"><path d="M9 22v-4c-4 1-4-2-6-2m12 6v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.8 1-.9 2.1-1 3.5"/></symbol>
</defs></svg>
<header class="topbar"><div class="topbar-inner"><div class="brand" aria-hidden="true"><svg><use href="#library"/></svg></div><nav aria-label="表示とリンク"><a class="icon-button" href="https://github.com/Ryoma0622/public-reports" target="_blank" rel="noopener noreferrer" aria-label="公開レポートのGitHubを開く" title="公開レポートのGitHubを開く"><svg aria-hidden="true" focusable="false"><use href="#github"/></svg></a><button class="icon-button" type="button" id="theme" aria-label="ダークモードに切り替える" title="ダークモードに切り替える"><svg class="theme-sun" aria-hidden="true" focusable="false"><use href="#sun"/></svg><svg class="theme-moon" aria-hidden="true" focusable="false"><use href="#moon"/></svg></button></nav></div></header>
<main><section class="intro" aria-labelledby="library-title"><div><h1 id="library-title">公開レポート</h1><p>図や音声と一緒に読むレポート集。</p></div><span class="count" aria-live="polite"><svg aria-hidden="true"><use href="#file"/></svg><span id="count">—</span></span></section><ul id="reports" aria-label="レポート一覧"></ul><p id="status" role="status">レポートを読み込んでいます…</p></main>
<script>
const root=document.documentElement;
function theme(value){root.dataset.theme=value;const button=document.querySelector('#theme'),label=value==='dark'?'ライトモードに切り替える':'ダークモードに切り替える';button.setAttribute('aria-label',label);button.title=label;try{localStorage.setItem('public-reports-theme',value)}catch{}}
let saved;try{saved=localStorage.getItem('public-reports-theme')}catch{}
theme(saved==='dark'||saved==='light'?saved:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
document.querySelector('#theme').onclick=()=>theme(root.dataset.theme==='dark'?'light':'dark');
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),use=document.createElementNS(svg.namespaceURI,'use');svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');use.setAttribute('href','#'+name);svg.append(use);return svg;}
fetch('reports.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{
  const list=document.querySelector('#reports');
  for(const item of [...items].reverse()){
    const li=document.createElement('li'),link=document.createElement('a'),symbol=document.createElement('span'),copy=document.createElement('div'),title=document.createElement('h2'),meta=document.createElement('div'),date=document.createElement('time'),arrow=icon('arrow');
    link.className='report-link';link.href='reports/'+encodeURIComponent(item.slug)+'/';symbol.className='report-icon';symbol.append(icon('file'));copy.className='report-copy';title.textContent=item.title;meta.className='report-meta';date.dateTime=item.published_at;date.textContent=new Date(item.published_at).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});date.setAttribute('aria-label','公開日：'+date.textContent);meta.append(icon('calendar'),date);copy.append(title,meta);arrow.classList.add('report-arrow');link.append(symbol,copy,arrow);li.append(link);list.append(li);
  }
  document.querySelector('#count').textContent=items.length+'件';document.querySelector('#status').textContent=items.length?'':'公開済みのレポートはまだありません。';
}).catch(()=>document.querySelector('#status').textContent='一覧を読み込めませんでした。');
</script>
</body>
</html>
