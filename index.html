<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公開レポート</title><style>
:root{color-scheme:light;--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#636366;--line:#dedee3;--accent:#0066cc}html[data-theme=dark]{color-scheme:dark;--bg:#111113;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#aaaab2;--line:#38383a;--accent:#64b5ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:960px;margin:auto;padding:64px 24px}header{display:flex;align-items:start;gap:24px}h1{font-size:clamp(30px,6vw,44px);letter-spacing:-.04em;margin:0}header>div{flex:1}p{color:var(--muted)}button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}.theme-sun{display:none}html[data-theme=dark] .theme-sun{display:block}html[data-theme=dark] .theme-moon{display:none}ul{list-style:none;padding:0;margin:40px 0}li{border-top:1px solid var(--line);padding:24px 0}a{color:var(--accent);font-size:21px;text-decoration:none}a:hover{text-decoration:underline}time{display:block;color:var(--muted);font-size:13px;margin-top:8px}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(max-width:480px){main{padding:32px 20px}header{gap:12px}button{font-size:13px;padding:8px}}
</style></head><body><main><header><div><h1>公開レポート</h1><p>レポートを図や音声と一緒に読めます。</p></div><button type="button" id="theme" aria-label="ダークモードに切り替える" title="ダークモードに切り替える"><svg class="theme-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><svg class="theme-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button></header><ul id="reports" aria-label="レポート一覧"></ul><p id="status" role="status">レポートを読み込んでいます…</p></main><script>
const root=document.documentElement;function theme(value){root.dataset.theme=value;const button=document.querySelector('#theme'),label=value==='dark'?'ライトモードに切り替える':'ダークモードに切り替える';button.setAttribute('aria-label',label);button.title=label;try{localStorage.setItem('public-reports-theme',value)}catch{}}let saved;try{saved=localStorage.getItem('public-reports-theme')}catch{}theme(saved|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));document.querySelector('#theme').onclick=()=>theme(root.dataset.theme==='dark'?'light':'dark');fetch('reports.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{const list=document.querySelector('#reports');for(const item of [...items].reverse()){const li=document.createElement('li'),link=document.createElement('a'),date=document.createElement('time');link.href='reports/'+encodeURIComponent(item.slug)+'/';link.textContent=item.title;date.dateTime=item.published_at;date.textContent=new Date(item.published_at).toLocaleDateString('ja-JP');li.append(link,date);list.append(li)}document.querySelector('#status').textContent=items.length?'':'公開済みのレポートはまだありません。'}).catch(()=>document.querySelector('#status').textContent='一覧を読み込めませんでした。');
</script></body></html>
